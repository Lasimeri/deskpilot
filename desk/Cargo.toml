[package]
name = "desk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zbus = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
libc = "0.2"
serde_json = "1"
